<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에어컨 분해도</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 색·폰트는 임시 토큰이다. 프로젝트 디자인 토큰이 있으면 :root 만 갈아끼운다. */
  :root{
    --studio:#c5d3d9; --studio2:#d3dce1; --panel:#ffffff; --line:#d3dade; --ink:#0b2027;
    --dim:#465d68; --accent:#004e64; --accent-soft:#e6f4f8; --warn:#8a5d00; --lead:#54707c;
    --shadow:0 1px 2px rgba(16,24,32,.06),0 8px 24px rgba(16,24,32,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --studio:#12171c; --studio2:#1b222a; --panel:#161c22; --line:#28313a; --ink:#e8edf2;
      --dim:#9aa7b4; --accent:#4fb8e8; --accent-soft:#15303d; --warn:#e2b04f; --lead:#5d6a77;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --studio:#12171c; --studio2:#1b222a; --panel:#161c22; --line:#28313a; --ink:#e8edf2;
    --dim:#9aa7b4; --accent:#4fb8e8; --accent-soft:#15303d; --warn:#e2b04f; --lead:#5d6a77;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--studio);color:var(--ink);
    font:400 15px/1.55 'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  #app{display:grid;grid-template-columns:1fr 340px;height:100dvh}
  #view{position:relative;min-width:0;overflow:hidden;
    background:radial-gradient(120% 90% at 50% 38%,var(--studio2),var(--studio))}
  canvas{display:block;touch-action:none;position:absolute;inset:0;z-index:0}
  #callouts{position:absolute;inset:0;z-index:1;pointer-events:none}
  #callouts svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  /* 부품 이름표 — 번호 동그라미 + 이름 + '세척' 배지를 한 줄 알약에 넣는다.
     배지를 이름과 같은 상자에 넣으면 좁을 때 '세/척'으로 쪼개진다(2026-09-21 지적). 형제로 뺀다 */
  .co{position:absolute;pointer-events:auto;cursor:pointer;width:max-content;
    display:grid;grid-template-columns:auto auto auto;align-items:center;column-gap:6px;
    font-size:11.5px;line-height:1.35;color:var(--ink);max-width:min(252px,44%);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:3px 10px 3px 3px;box-shadow:0 1px 2px rgba(11,32,39,.06),0 4px 14px rgba(11,32,39,.08);
    transition:opacity .25s,border-color .18s,box-shadow .18s}
  .co i{font-style:normal;flex:none;width:18px;height:18px;border-radius:999px;
    background:var(--accent);color:#fff;font-size:10.5px;font-weight:600;
    display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .co em{font-style:normal;font-weight:600;font-size:12px;letter-spacing:-.01em;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .co.wash::after{content:'세척';grid-column:3;font-size:9.5px;font-weight:600;
    color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 6px;white-space:nowrap}
  .co span{display:none;grid-column:1/-1;color:var(--dim);padding-left:24px}
  .co:hover span,.co.on span{display:block}
  .co:hover{border-color:var(--accent);z-index:5}          /* 펼쳐진 이름표가 옆을 덮지 않게 위로 */
  .co.on{z-index:6}
  .co.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .co:hover span,.co.on span{background:var(--panel)}   /* 펼친 줄이 뒤 도면에 겹쳐 읽히던 것 */
  .co.on em{color:var(--accent)}
  /* 좁은 화면: 번호만 */
  .co.num{max-width:none;padding:2px;grid-template-columns:auto;column-gap:0}
  .co.num::before{content:'';position:absolute;inset:-5px}   /* 번호만일 때 누르는 자리 36px(이웃 레인 34px 와 안 겹치게) */
  .co.num em,.co.num span,.co.num::after{display:none}
  .co.num i{width:20px;height:20px;font-size:11px}
  /* 이름 띠 — 이름표가 번호만 남는 폭(휴대폰·태블릿 임베드)에서 번호 + 이름을 한 줄로. 옆으로 밀고, 누르면 그 부품으로
     (2026-10-05: 휴대폰에서 번호만 보여 무엇인지 알 수 없었다). '전체'를 누르면 띠가 위로 펴져 이름을 한눈에 본다.
     무대 아래 칸(45px)이라 도면·재생 바 배치는 그대로고, 펴진 판은 도면 위에 겹친다(무대 크기를 바꾸지 않는다) */
  #names{display:none;position:relative;z-index:6}
  body.embed.names #app{grid-template-rows:1fr 45px}
  body.embed.names #names{display:block}
  #nmsheet{position:absolute;left:0;right:0;bottom:0;height:45px;display:flex;align-items:center;overflow:hidden;
    background:var(--panel);border-top:1px solid var(--line);transition:height .36s cubic-bezier(.16,1,.3,1),box-shadow .36s,border-radius .36s}
  #nmall{flex:none;align-self:stretch;min-width:52px;min-height:44px;padding:0 12px;border:0;border-right:1px solid var(--line);
    background:none;color:var(--accent);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  #nmall:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  #nmlist{position:relative;flex:1;min-width:0;display:flex;gap:6px;align-items:center;padding:6px 10px;
    overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;transition:opacity .16s}
  #nmlist::-webkit-scrollbar{display:none}
  #nmlist::after{content:'';flex:none;width:72px}   /* 끝 칩이 사이트 고정 문의 버튼 밑에서 빠져나올 자리(#bar 의 88px 과 같은 이유) */
  #nmlist[data-more]{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
  #nmlist[data-less]{-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px);mask-image:linear-gradient(90deg,transparent,#000 24px)}
  #nmlist[data-less][data-more]{-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 40px),transparent)}
  #nmlist:focus-within{-webkit-mask-image:none;mask-image:none}
  .nm{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px 0 4px;
    border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:600;line-height:1;letter-spacing:-.01em;white-space:nowrap;
    transition:border-color .18s,background-color .18s,color .18s,transform .18s}
  .nm::before{content:'';position:absolute;inset:-7px -1px}   /* 누르는 높이 44px(테두리 안 30 + 14) */
  .nm i{font-style:normal;flex:none;width:22px;height:22px;border-radius:999px;background:var(--accent);color:#fff;
    font-size:11px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .nm:active{transform:scale(.96)}
  .nm.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .nm:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  /* 펴진 판 — 같은 칩을 2단 표로. 위에서부터 차례로 떠오른다 */
  #nmsheet.open{flex-direction:column-reverse;align-items:stretch;border-radius:14px 14px 0 0;box-shadow:0 -10px 28px rgba(11,32,39,.14)}
  #nmsheet.open #nmall{align-self:flex-start;flex:0 0 44px;border-right:0}   /* '전체'↔'접기'는 제자리 — 같은 곳을 두 번 눌러 여닫는다 */
  #nmsheet.open #nmlist{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 8px;align-content:start;
    padding:6px 10px 0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:auto;-webkit-mask-image:none;mask-image:none}
  #nmsheet.open #nmlist::after{display:none}
  #nmsheet.open .nm{min-height:44px;padding:4px 8px 4px 4px;border-color:transparent;border-radius:8px;
    white-space:normal;word-break:keep-all;text-align:left;line-height:1.3;animation:nmin .34s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--i)*14ms)}
  #nmsheet.open .nm::before{display:none}
  #nmsheet.open .nm.on{border-color:var(--accent)}
  #nmsheet.shut{border-radius:0;box-shadow:none}    /* 접히는 동안 모서리·그림자도 같이 돌아간다 */
  #nmsheet.shut #nmlist{opacity:0}                  /* 한 줄 ↔ 표로 배치가 바뀌는 순간을 가린다(펼 때·접을 때 모두) */
  @keyframes nmin{from{opacity:0;transform:translateY(6px)}}
  #side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 40px}
  h1{font-size:17px;margin:0 0 3px;letter-spacing:-.012em;line-height:1.35}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;color:var(--dim);
    border-top:1px solid var(--line);padding-top:12px;margin-bottom:14px;font-variant-numeric:tabular-nums}
  .spec b{color:var(--ink);font-weight:500}
  .list{display:flex;flex-direction:column;gap:1px}
  .row{display:flex;gap:9px;align-items:baseline;padding:7px 10px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;font-size:13.5px;text-align:left;background:none;color:inherit;
    font-family:inherit;width:100%}
  .row:hover{background:var(--accent-soft)}
  .row:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .row.on{background:var(--accent-soft);border-color:var(--accent)}
  .row .st{color:var(--accent);font-size:11.5px;min-width:18px;font-variant-numeric:tabular-nums}
  .row .en{color:var(--dim);font-size:10.5px;margin-left:auto;text-align:right;max-width:46%}
  .badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;
    border:1px solid var(--warn);color:var(--warn);vertical-align:2px;margin-left:7px;font-weight:400}
  #info{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;font-size:13.5px}
  #info h2,#card h2{font-size:15.5px;margin:0 0 6px;font-weight:600}
  #info .k,#card .k{color:var(--dim);font-size:11.5px;margin-top:10px;letter-spacing:.03em}
  #bar{position:absolute;left:0;right:0;bottom:0;z-index:3;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center}
  input[type=range]{flex:1;accent-color:var(--accent);height:28px;min-width:80px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;
    padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);white-space:nowrap}
  .btn:hover{border-color:var(--accent)} .btn.on{background:var(--accent-soft);border-color:var(--accent)}
  #head{position:absolute;top:14px;left:18px;right:18px;z-index:3;display:flex;justify-content:space-between;
    gap:12px;align-items:flex-start;pointer-events:none}
  #head .t{font-size:12px;color:var(--dim);line-height:1.4;max-width:60%;word-break:keep-all}
  #head .t b{display:block;color:var(--ink);font-size:14px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
  #head .t .ln{display:block;margin-top:3px;font-size:11px;color:var(--dim)}
  #note{font-size:11px;color:var(--dim);text-align:right;max-width:260px;line-height:1.4}
  #card{display:none;position:absolute;left:14px;right:14px;bottom:70px;z-index:4;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);
    max-width:460px;margin:0 auto;max-height:42dvh;overflow-y:auto;font-size:13.5px}
  body.embed #card{max-height:calc(100% - 84px);overflow-y:auto;overscroll-behavior:auto}   /* 넘칠 때만 안 스크롤, 끝에서 페이지로 이어진다 */
  #card.on{display:block}
  #card .x{position:absolute;top:0;right:0;min-width:44px;min-height:44px;display:grid;place-items:center;border:0;background:none;color:var(--dim);font-size:19px;cursor:pointer}   /* 누르는 자리 44px */
  #err{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--dim);z-index:5}
  body.embed #app{grid-template-columns:1fr;grid-template-rows:1fr}
  body.embed #bar{padding-right:88px}
  body.embed #side{display:none}
  body.embed #note{display:none}   /* 사이트가 카드 아래에 같은 고지를 한다 — 겹치지 않게 */
  @media (max-width:880px){
    #app{grid-template-columns:1fr;grid-template-rows:60dvh 1fr}
    body.embed #app{grid-template-rows:1fr}
    #side{border-left:0;border-top:1px solid var(--line);padding:16px 16px 32px}
    #note{display:none}
    #head .t{max-width:none}   /* 오른쪽 #note 가 숨으니 60% 로 묶을 이유가 없다 — '부품 / 14개' 꺾임 */
    .co span{display:none}   /* 폭 제한은 기본 규칙(min(252px,44%))에 맡긴다 — 120px 는 이름을 잘랐다 */
  }
  /* 누르는 자리 44px(터치 기기) — 재생·조립 버튼은 보이는 높이(33px)는 그대로 두고 위아래로 넓힌다. 막대는 높이를 키우되 자리는 그대로(위아래 -8px).
     baramdaero-site 사본에서 덧붙임(2026-10-06) — 뷰어 원본(parts3d/web/src.html)에도 같은 규칙이 들어가야 다시 만들 때 남는다 */
  @media (pointer:coarse){
    .btn{position:relative}
    .btn::before{content:'';position:absolute;inset:-7px 0}   /* 테두리 안 31 + 14 = 45px */
    input[type=range]{height:44px;margin-block:-8px}
  }
  @media (prefers-reduced-motion: reduce){ .co,.nm,#nmsheet,#nmlist{transition:none} #nmsheet.open .nm{animation:none} }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="callouts"><svg aria-hidden="true"></svg></div>
    <div id="head"><div class="t" id="headt"></div><div id="note"></div></div>
    <div id="card"><button class="x" aria-label="닫기">×</button><div id="cardbody"></div></div>
    <div id="err">이 브라우저에서 3D를 표시할 수 없습니다. 최신 브라우저에서 열어 주세요.</div>
    <div id="bar">
      <button class="btn" id="play">분해 재생</button>
      <input type="range" id="ex" min="0" max="100" value="100" aria-label="분해 정도">
      <button class="btn" id="reset">조립</button>
    </div>
  </div>
  <div id="names" role="group" aria-label="부품 이름">
    <div id="nmsheet">
      <button type="button" id="nmall" aria-expanded="false" aria-controls="nmlist">전체</button>
      <div id="nmlist"></div>
    </div>
  </div>
  <div id="side">
    <h1 id="ttl">분해도</h1>
    <div class="sub" id="sub"></div>
    <div class="spec" id="spec"></div>
    <div class="list" id="list"></div>
    <div id="info"></div>
  </div>
</div>

  if (k === 'drain') return /pump|hose/.test(id) ? M.plastic : M.drain;

  if (k === 'fan') return /cross|circ/.test(id) ? M.fanLight : M.fan;
  if (k === 'motor') return M.motor;
  if (k === 'bracket') return M.steel;
  if (k === 'heat_exchanger') return M.fin;

function rrect(s, cx, cy, w, d, r) {             // 모서리 둥근 사각 경로(Shape·Path 공용)
  const x = cx - w/2, y = cy - d/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);      s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r);  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d);      s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r);          s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function extrudeFlat(s, h, seg=6) {                // 판 모양을 두께 h 로 세운다(모양 y = 부품 로컬 y)
  const g = new THREE.ExtrudeGeometry(s, {depth:h, bevelEnabled:false, curveSegments:seg});
  g.rotateX(-Math.PI/2); g.translate(0, -h/2, 0);   // y: 0..h → -h/2..h/2
  return g;
}
function roundedPlate(w, d, h, r) {                // 모서리 둥근 판 (판넬)
  return extrudeFlat(rrect(new THREE.Shape(), 0, 0, w, d, r), h);
}
// 구멍 뚫린 한 장짜리 판(판넬·드레인팬). 막대 4개로 테를 만들면 막대가 만나는 모서리에 홈이 파인다.
// holes: [{c:[x,y], size:[w,d], shape:'rect'|'circle'}] — mm, 부품 로컬 좌표(x 긴 변, y 짧은 변)
function plateWithHoles(w, d, h, holes, r) {          // r = 모서리 반경(mm). 없으면 짧은 변의 5%
  const s = rrect(new THREE.Shape(), 0, 0, w*S, d*S, (r ?? Math.min(w, d)*0.05)*S);
  for (const o of holes) {
    const [cx, cy] = o.c || [0, 0], [hw, hd] = o.size, path = new THREE.Path();
    if (o.shape === 'circle') path.absarc(cx*S, cy*S, hw/2*S, 0, Math.PI*2, false);
    else rrect(path, cx*S, cy*S, hw*S, hd*S, Math.min(hw, hd)*0.1*S);
    s.holes.push(path);
  }
  return extrudeFlat(s, h*S, holes.some(o => o.shape === 'circle') ? 64 : 6);   // 원 구멍은 각이 보이지 않게
}
function bladeGeo(len, chord, thick) {             // 휘어진 팬 날개
  const s = new THREE.Shape();
  s.moveTo(-chord/2, -thick/2);
  s.quadraticCurveTo(0, -thick/2 - chord*0.22, chord/2, -thick/2);
  s.lineTo(chord/2, thick/2);
  s.quadraticCurveTo(0, thick/2 - chord*0.22, -chord/2, thick/2);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, {depth:len, bevelEnabled:false, curveSegments:5});
  g.rotateX(-Math.PI/2); g.translate(0, -len/2, 0);
  return g;
}

function meshFor(p) {
  const [w, d, h] = p.size_mm, [hw, hd] = p.hole_mm || [0, 0];

    G.add(mesh); return mesh;

  const ringOf = (W, D, H, HW, HD, geoFn) => {     // 가운데가 뚫린 사각 테
    const t = [[W, (D-HD)/2, 0, (D+HD)/4], [W, (D-HD)/2, 0, -(D+HD)/4],

    for (const [bw, bd, cx, cz] of t) add(geoFn(bw, bd, H), [cx, 0, cz]);

    const r = Math.min(a, b, c) * S * 0.12;

    const geo = new THREE.CylinderGeometry(7*S, 7*S, 6*S, 10);

    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion()

      const sides = [[w, t, 0, (d-t)/2], [w, t, 0, -(d-t)/2],

      sides.forEach(([bw, bd, cx, cz], i) => { if (!(i === 0 && p.open_front)) add(boxG(bw, bd, h), [cx, 0, cz]); });   // open_front: 앞(y−) 벽 없음

    case 'blade4': {                                // 4면 토출 블레이드: 판넬 테의 네 토출구에 변과 나란히 눕는다

      for (let i = 0; i < pos.count; i++) {      // 가로 위치에 따라 앞으로 부풀린다 — 가운데는 제자리, 양끝이 뒤로 0.19d
        const x = pos.getX(i), z = pos.getZ(i);

      break;
    case 'disc_grid': {          // 원형 흡입 그릴: 테 + 살

    case 'dome_perf': {          // 타공 돔 그릴(360): 아래로 얕게 볼록한 구면 + 테. 타공은 무늬로 표시
      const r = w/2, sag = h*0.8, R = (r*r + sag*sag)/(2*sag), th = Math.asin(r/R);

      for (const it of p.items_mm || [])
        add(roundedPlate(it.size[0]*S, it.size[1]*S, it.size[2]*S, Math.min(...it.size)*0.2*S),

    case 'hanger4':                                 // 행거 4개: 외곽(w×d) 긴 변 양 끝 — 원형 배치는 직사각(1Way)에서 본체 밖에 뜬다
      for (const sx of [-1, 1]) for (const sz of [-1, 1])

// ---- 배치: 세워서 한 줄로 전체 분해 ----
// 기종마다 '분해 축'을 화면 가로(X)로, 제품의 긴 변을 화면 세로(Y)로 돌린다.
// three 좌표(x, y=위, z) 는 평면(x, z, -y). 아래 행렬은 three → 화면 좌표 회전(모두 det=+1).
const CEILING = DATA.form === '4way' || DATA.form === '1way';
const ROT = {
  ceiling: [[0,1,0],[1,0,0],[0,0,-1]],     // 천장 속(위) 방향 → 오른쪽, 긴 변 → 세로
  wall:    [[0,0,-1],[1,0,0],[0,-1,0]],    // 뒤쪽 → 오른쪽, 가로(긴 변) → 세로

// 분해 순서대로 한 줄에 놓는다. 같은 단계 안에서는 조립 위치(분해 축) 순서.

const homeC = new THREE.Box3(); items.forEach(it => homeC.expandByPoint(it.home));
const hc = homeC.getCenter(new THREE.Vector3());
items.forEach(it => it.home.sub(hc));
let cursor = 0;
order.forEach((it, i) => {

order.forEach(it => { it.slot.x -= lineLen / 2; });

  for (const it of order) { const m = Math.max(it.size.y, it.size.z);

const ext = k => [Math.min(...items.map(it => it.slot[k] - it.size[k]/2)), Math.max(...items.map(it => it.slot[k] + it.size[k]/2))];
const [yLo, yHi] = ext('y'), [zLo, zHi] = ext('z');

// 바닥 그림자만 받는 판
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({opacity:.32}));
ground.rotation.x = -Math.PI/2; ground.position.y = yLo - 0.02; ground.receiveShadow = true;
scene.add(ground);
key.shadow.camera.left = -lineLen; key.shadow.camera.right = lineLen;
key.shadow.camera.top = lineLen; key.shadow.camera.bottom = -lineLen;
key.shadow.camera.far = 30;
key.shadow.bias = -0.00023;                       // 실거리 = |bias| x (far-near) — 0.0008 이면 23.6mm 로 부품보다 두껍다
key.shadow.normalBias = Math.min(lineLen / 512, 0.006);

// 카메라: 줄이 화면을 비스듬히 가로지르는 3/4 — 레퍼런스식 분해도 구도
// 벽걸이·스탠드는 화면 오른쪽(+X)이 제품 뒤쪽이라 앞에서 본다(-X) — 고객이 아는 면이 먼저 보이게
const FRONT = DATA.form === '벽걸이' || DATA.form === '스탠드' ? -1 : 1;

function fits(dist, corners, my) {

// 지금 부품 위치의 외곽 — 부품마다 빠지는 시차가 있어 t 곡선으로 거리를 정하면 분해 중간에 화면 밖으로 나갔다(10-02 검토)

}

// 좁으면 이름표는 번호만(글씨 겹침 방지) — 1080 무대에서 19개까지 이름. 번호만일 때는 아래 이름 띠가 이름을 맡는다

nmList.innerHTML = order.map((it, i) => `<button type="button" class="nm" style="--i:${i}" data-id="${it.p.id}" aria-pressed="false"><i>${it.n}</i>${esc(it.p.name_ko)}</button>`).join('');

  clearTimeout(nmTimer);
  nmAll.setAttribute('aria-expanded', open); nmAll.textContent = open ? '접기' : '전체';
  if (open) {
    nmSheet.classList.add('shut');                      // 띠의 칩을 먼저 흐린 뒤 표로 바꾼다
    nmTimer = setTimeout(() => {
      const h0 = nmSheet.offsetHeight;
      nmSheet.classList.remove('shut'); nmSheet.classList.add('open');
      nmSheet.style.height = 'auto';
      // 올림: 소수점 높이를 내림하면 목록이 1px 넘쳐 첫 스와이프를 목록이 먹는다
      const h1 = Math.min(Math.ceil(nmSheet.getBoundingClientRect().height), $('#app').clientHeight);
      nmSheet.style.height = h0 + 'px'; nmSheet.offsetHeight;   // 시작 높이를 확정한 뒤 목표로
      nmSheet.style.height = h1 + 'px';
      nmList.scrollTop = 0;
    }, REDUCED ? 0 : 140);
  } else {
    nmSheet.classList.add('shut'); nmSheet.style.height = '';
    nmTimer = setTimeout(() => {
      nmSheet.classList.remove('open', 'shut');
      const on = nmList.querySelector('.nm.on'); if (on) centerChip(on, false);
      syncNames();
    }, REDUCED ? 0 : 360);
  }
}
nmAll.addEventListener('click', () => setNames(nmAll.getAttribute('aria-expanded') !== 'true'));
nmList.addEventListener('click', e => {
  const b = e.target.closest('.nm'); if (!b) return;
  b.dataset.id === selected ? (clearSel(), goHome()) : select(b.dataset.id);   // 고른 칩을 다시 누르면 전체로
  setNames(false);
});
nmList.addEventListener('scroll', syncNames, {passive: true});
$('#view').addEventListener('pointerdown', () => setNames(false));              // 판 밖(도면)을 누르면 접는다
syncNames();

// ---- 라벨: 번호 + 이름 + 한 줄 설명, 위·아래 번갈아, 지시선 ----
const svg = $('#callouts svg');
const labels = order.map((it, i) => {
  const el = document.createElement('div');
  el.className = 'co' + (it.p.wash ? ' wash' : '');
  el.style.opacity = 0;
  const sent = (it.p.clean || '').split(/[.。]/)[0];
  // 22자 = 칩 설명 1줄 한도. 자를 땐 걸친 어절을 버리고 … 를 붙여 잘렸음을 표시한다(전문은 선택 시 카드에 나온다)
  const short = sent.length > 22 ? sent.slice(0, 22).replace(/\s\S*$/, '') + '…' : sent;
  el.innerHTML = `<i>${it.n}</i><em>${esc(it.p.name_ko)}</em><span>${esc(it.p.name_en || '')}</span>`
               + (short && !/^—/.test(short) ? `<span>${esc(short)}</span>` : '');
  el.addEventListener('click', () => select(it.p.id));
  $('#callouts').appendChild(el);
  return {it, el, up: i % 2 === 0};
});
const V = new THREE.Vector3();
function project(v) {
  V.copy(v).project(camera);
  const r = renderer.domElement;
  return [(V.x + 1)/2 * r.clientWidth, (1 - V.y)/2 * r.clientHeight];
}
function drawCallouts() {
  const show = t > 0.92 ? Math.min(1, (t - 0.92)/0.08) : 0;
  const W = renderer.domElement.clientWidth, H = renderer.domElement.clientHeight;
  if (!W || !H) return;                                    // 숨겨진(지연 로딩) 프레임: 크기가 0 이면 좌표가 NaN 이다
  const numOnly = numOnlyAt(W);
  labels.forEach(L => L.el.classList.toggle('num', numOnly));
  // 부품 위/아래 끝의 화면 좌표
  const pts = labels.map(L => {
    const it = L.it, c = it.g.position;
    const top = project(new THREE.Vector3(c.x, c.y + it.size.y/2, c.z));
    const bot = project(new THREE.Vector3(c.x, c.y - it.size.y/2, c.z));
    return {L, top, bot};
  });
  const minTop = Math.min(...pts.map(q => q.top[1])), maxBot = Math.max(...pts.map(q => q.bot[1]));
  let rowUp = Math.max(62, minTop - 34), rowDn = Math.min(H - 110, maxBot + 26);
  // 겹치지 않게: 가로로 못 피하면 위(아래)로 한 줄씩 쌓는다
  const LANE = 34;
  let upLanes = 0, dnLanes = 0;
  for (const up of [true, false]) {
    const row = pts.filter(q => q.L.up === up).sort((a, b) => a.top[0] - b.top[0]);
    const lanes = [];
    row.forEach(q => {
      q.w = q.L.el.offsetWidth || 110;
      q.ax = (up ? q.top[0] : q.bot[0]);
      const x = Math.max(8, Math.min(W - q.w - 8, q.ax - q.w/2));
      let lane = 0;
      while ((lanes[lane] || []).some(o => x < o.x1 + 8 && x + q.w + 8 > o.x0)) lane++;
      (lanes[lane] ||= []).push({x0:x, x1:x + q.w});
      q.x = x; q.lane = lane;
    });
    const deep = Math.max(0, ...row.map(q => q.lane));
    if (up) upLanes = deep; else dnLanes = deep;
  }
  // 쌓인 줄만큼 시작점을 당긴다 — 위는 헤더, 아래는 재생 바를 넘지 않게
  const headB = ($('#head')?.getBoundingClientRect().bottom || 62) - renderer.domElement.getBoundingClientRect().top;
  const LH = labels[0]?.el.offsetHeight || 26;
  rowUp = Math.max(headB + LH + upLanes*LANE + 8, rowUp);   // 헤더 실제 하단 + 라벨 높이만큼 비운다
  rowDn = Math.min(H - 110 - dnLanes*LANE, rowDn);
  let lines = '';
  const ok = (...v) => v.every(Number.isFinite);
  pts.forEach(q => {
    const {L} = q, el = L.el, hgt = el.offsetHeight || 40;
    const y = L.up ? rowUp - hgt - q.lane*LANE : rowDn + q.lane*LANE;
    el.style.transform = `translate(${q.x}px, ${y}px)`;
    el.style.opacity = show; el.style.pointerEvents = show > .5 ? 'auto' : 'none';
    el.classList.toggle('on', L.it.p.id === selected);
    const [ax, ay] = L.up ? q.top : q.bot;
    const lx = q.x + Math.min(q.w/2, 16), ly = L.up ? y + hgt : y;
    if (show > 0 && ok(ax, ay, lx, ly)) lines += `<polyline points="${ax},${ay} ${ax},${(ay+ly)/2} ${lx},${ly}" fill="none"
      stroke="var(--lead)" stroke-width="1" opacity="${show}"/><circle cx="${ax}" cy="${ay}" r="2.2"
      fill="var(--lead)" opacity="${show}"/>`;
  });
  svg.innerHTML = lines;
}

// 2026-10-02 대표 '매끄럽지 못하다': 예전엔 화면 밖에서도 매 프레임 그리고 라벨 배치(강제 레이아웃)를 해서
// 같은 출처인 부모 페이지 스크롤까지 무거웠다. 이제 필요할 때만 그리고, 화면 밖이면 쉰다
let onScreen = true;
if ('IntersectionObserver' in window) new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; if (onScreen) dirty = true; }).observe(document.body);
const easeIO = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
if (renderer) (function loop() {
  requestAnimationFrame(loop);
  if (!onScreen) return;
  if (playing) {
    t = Math.min(1, t + (REDUCED ? 0.03 : rate)); $('#ex').value = t*100; apply();
    if (t >= 1) stopPlay();
  }
  if (camTw) {
    if (camTw.follow) camTw.p1.copy(HOME().pos);
    const k = Math.min(1, (performance.now() - camTw.t0) / camTw.dur), e2 = easeIO(k);
    camera.position.lerpVectors(camTw.p0, camTw.p1, e2); controls.target.lerpVectors(camTw.q0, camTw.q1, e2);
    if (k >= 1) camTw = null;
    dirty = true;
  }
  if (controls.update()) dirty = true;                  // 드래그·감쇠 중이면 true
  if (!dirty) return;
  dirty = false;
  renderer.render(scene, camera); drawCallouts();
})();

// ---- 선택 ----
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
if (renderer) {
  renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', e => {
    const slop = e.pointerType === 'touch' ? 12 : 6;        // 손가락 떨림(5~15px)으로 탭이 버려지던 것
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > slop) return;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1);
    ray.setFromCamera(ptr, camera);
    const hit = ray.intersectObjects(items.map(i => i.g), true).find(h => h.object.userData.part);
    hit ? select(hit.object.userData.part.id) : selected && (clearSel(), goHome());
  });
}
const dimmed = new Map();
function paintMaterials() {
  for (const it of items) it.g.traverse(o => {
    if (!o.isMesh && !o.isInstancedMesh) return;
    if (!dimmed.has(o)) dimmed.set(o, { m: o.material, cs: o.castShadow });
    const { m: base, cs } = dimmed.get(o);
    if (selected && it.p.id !== selected) {
      if (!o.userData.ghost) { const m = base.clone(); m.transparent = true; m.opacity = .08; m.depthWrite = false; o.userData.ghost = m; }
      o.material = o.userData.ghost;
      o.castShadow = false;            // 재질 투명도는 그림자 맵과 무관하다 — 끄지 않으면 실루엣이 바닥에 남는다
    } else { o.material = base; o.castShadow = cs; }
  });
  dirty = true;
}
function select(id) {
  const it = items.find(x => x.p.id === id); if (!it) return;
  selected = id; paintMaterials();
  if (t < 1) {                                     // 조립·재생 중: 한 프레임에 튀지 않게 빠르게 펼친다(이름 띠는 조립 상태에서도 눌린다)
    if (REDUCED) { t = 1; $('#ex').value = 100; apply(); }
    else { rate = Math.max(0.0055, (1 - t) / 30); playing = true; $('#play').classList.add('on'); $('#play').textContent = '멈춤'; }
  }
  const c = it.slot.clone();                       // 다 펼친 자리 — 펼치는 중에 골라도 목표는 같다
  const r = Math.max(it.size.y, it.size.z, 0.35) * 3.2;
  autoCam = false;
  camTo(new THREE.Vector3(c.x + r*0.35, c.y + r*0.3, c.z + r), c);   // 순간이동 대신 부드럽게 다가간다
  paint(); post('select', {id});
}
function clearSel() { selected = null; paintMaterials(); paint(); }

function infoHTML(p, n) {
  return `<h2>${n}. ${esc(p.name_ko)}${p.dim_estimated ? '<span class="badge">형상 추정</span>' : ''}</h2>
    <div class="k">부품명</div><div>${esc(p.name_en || '—')}</div>
    <div class="k">분해 순서</div><div>${p.step + 1}단계 · ${esc(p.step_name)}</div>
    <div class="k">어떻게 더러워지나</div><div>${esc(p.soil)}</div>
    <div class="k">우리가 어떻게 세척하나</div><div>${esc(p.clean)}</div>`;
}
function paint() {
  dirty = true;
  $('#ttl').textContent = DATA.title;
  {
    const sp = DATA.spec || {};
    const num = v => String(v).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1');   // 2.30 → 2.3 (값은 그대로, 뒤 0만 뗀다)
    const series = sp.series_ko
      ? (/^(LG전자|LG|삼성전자|삼성)\s/.test(sp.series_ko) ? sp.series_ko : `${DATA.brand} ${sp.series_ko}`)
      : `${DATA.brand} · ${DATA.form.toUpperCase()}`;
    const kwTxt = v => /^[\d.]+$/.test(String(v).trim()) ? num(v) + 'kW' : String(v);   // 원문에 'W'가 붙어 오면 그대로 쓴다
    const kw = sp.cooling_kw ? ` · 냉방 ${kwTxt(sp.cooling_kw)}` : '';
    const lu = sp.lineup
      ? `<span class="ln">이 시리즈는 냉방 ${num(sp.lineup.kw_min)}~${num(sp.lineup.kw_max)}kW로 나옵니다 · 화면은 ${num(sp.cooling_kw)}kW 기준</span>` : '';
    $('#headt').innerHTML = `<b>${esc(series)}</b>${esc(DATA.model_code)}${kw} · 부품&nbsp;${DATA.parts.length}개${lu}`;
  }
  $('#sub').textContent = `${DATA.brand} · ${DATA.form.toUpperCase()} · 부품 ${DATA.parts.length}개`;
  const unitless = v => String(v ?? '').replace(/\s*(mm|kg|kW)\b/gi, '').trim();   // 원문에 단위가 붙어 온 행이 있다
  $('#spec').innerHTML = [['본체', unitless(DATA.spec.body_size_mm)], ['판넬', unitless(DATA.spec.panel_size_mm)],
    ['중량', unitless(DATA.spec.weight_kg)], ['냉방', DATA.spec.cooling_kw && (/^[\d.\s]+$/.test(unitless(DATA.spec.cooling_kw)) ? unitless(DATA.spec.cooling_kw) + ' kW' : String(DATA.spec.cooling_kw))]]   // '7,200W' 처럼 단위가 붙은 원문에 kW 를 또 붙이지 않는다
    .filter(x => x[1]).map(([k, v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join('');
  $('#note').textContent = DATA.public_note
    || '외형 치수만 제원표 근거. 내부 부품 형상은 분해도를 보고 만든 추정이며 실제 치수가 아닙니다.';
  $('#list').innerHTML = order.map(it => `
    <button class="row${it.p.id === selected ? ' on' : ''}" data-id="${it.p.id}">
      <span class="st">${it.n}</span><span>${esc(it.p.name_ko)}</span>
      <span class="en">${esc(it.p.name_en || '')}</span></button>`).join('');
  $('#list').querySelectorAll('.row').forEach(r => r.addEventListener('click', () => select(r.dataset.id)));
  for (const b of nmList.children) {
    const on = b.dataset.id === selected;
    // 도면에서 번호를 눌러 골랐을 때도 그 이름이 띠 가운데로 온다(페이지는 안 움직이게 띠만 민다)
    if (on && !b.classList.contains('on') && !nmSheet.classList.contains('open')) centerChip(b);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  }
  const cur = order.find(x => x.p.id === selected);
  $('#info').innerHTML = cur ? infoHTML(cur.p, cur.n) : `<div class="k">부품이나 번호를 누르면 세척 방법이 나옵니다</div>`;
  $('#cardbody').innerHTML = cur ? infoHTML(cur.p, cur.n) : '';
  $('#card').classList.toggle('on', EMBED && !!cur);
}
function stopPlay() { playing = false; rate = 0.0055; $('#play').classList.remove('on'); $('#play').textContent = '분해 재생'; }
let exSaved = null;   // 슬라이더 위에서 시작한 세로 스와이프가 스크롤로 넘어가면(pointercancel) 값과 재생 상태를 되돌린다
$('#ex').addEventListener('pointerdown', e => { if (e.pointerType === 'touch') exSaved = {t, playing}; }, true);
$('#ex').addEventListener('pointerup', () => { exSaved = null; });
$('#ex').addEventListener('pointercancel', () => {
  if (!exSaved) return;
  t = exSaved.t;
  if (exSaved.playing && !playing) { playing = true; $('#play').classList.add('on'); $('#play').textContent = '멈춤'; }
  exSaved = null; $('#ex').value = t*100; apply(); post('explode', {t});
});
$('#ex').addEventListener('input', e => { t = +e.target.value/100; stopPlay(); apply(); post('explode', {t}); });
$('#reset').addEventListener('click', () => { t = 0; $('#ex').value = 0; stopPlay(); clearSel(); goHome(); apply(); });
$('#play').addEventListener('click', () => {
  playing = !playing; if (playing && t >= 1) { t = 0; clearSel(); goHome(); }
  $('#play').classList.toggle('on', playing); $('#play').textContent = playing ? '멈춤' : '분해 재생';
});
$('#card .x').addEventListener('click', () => { clearSel(); goHome(); });   // 닫으면 전체 보기로(확대된 채 남던 것)
addEventListener('keydown', e => { if (e.key === 'Escape') { setNames(false); clearSel(); goHome(); } });

function post(type, data) {
  if (parent !== window) parent.postMessage({ns:'ac3d', type, model:DATA.model_code, ...data}, '*');
}
addEventListener('message', e => {
  const m = e.data; if (e.source !== parent || !m || m.ns !== 'ac3d') return;
  if (m.type === 'explode' && typeof m.t === 'number') { t = Math.max(0, Math.min(1, m.t)); $('#ex').value = t*100; apply(); }
  if (m.type === 'select' && m.id) select(m.id);
  if (m.type === 'reset') $('#reset').click();
  if (m.type === 'play') {                     // 스크롤로 화면에 들어왔을 때 부모가 보낸다
    if (REDUCED) { t = 1; $('#ex').value = 100; apply(); return; }   // 모션 최소화 설정이면 바로 펼친다
    if (t > 0.02) return;                      // 이미 사람이 만졌으면 건드리지 않는다
    playing = true;
    $('#play').classList.add('on'); $('#play').textContent = '멈춤';
  }
});
if (Q.has('debug')) window.__ac3d = {camera, controls, items, order, lineLen, hMax,
  get t() { return t; }, get playing() { return playing; }, step: (n=30) => { for (let i=0;i<n;i++){ t=Math.min(1,t+0.0055); } apply(); $('#ex').value=t*100; return t; }};
paint(); apply();
$('#ex').value = t * 100;                       // 표시와 실제 상태를 맞춘다
document.title = DATA.title;
post('ready', {parts: order.map(it => ({id:it.p.id, n:it.n, name:it.p.name_ko}))});
</script>
</body>
</html>
