* { box-sizing: border-box; }

/* ---------- stage ---------- */
.stage {
  position: relative;

  border: 1px solid var(--line);

.btn, .seg button {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 6px;

.btn:hover, .seg button:hover { border-color: var(--ink-faint); }

  content: ""; width: 10px; height: 10px; border-radius: 2px;

}
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--ice-soft); }

.sheet {

.sheet[data-collapsed] .grab .chev { transform: rotate(-135deg); }
.sheet[data-collapsed] .grab { border-bottom-color: transparent; }
.sheet[data-collapsed] .sheet-body { display: none; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 16px; }
.sheet-body > * { flex-shrink: 0; }
.sheet h2.group { font-size: 11.5px; font-weight: 500; letter-spacing: .06em; color: var(--ink-faint); margin-bottom: 6px; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0; }

.facts dd small { font-size: 11.5px; color: var(--ink-soft); font-weight: 400; }
.facts dd .sub2 { display: block; font-size: 11.5px; color: var(--ink-soft); font-weight: 400; }

.rooms { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.room-btn {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: baseline;
  padding: 8px 10px; border: 1px solid transparent; border-radius: 6px;

.room-btn:hover, .room-btn.is-hover { background: var(--mist); }

.unit-btn .u { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); }

.legend { display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
.legend div { display: flex; align-items: center; gap: 8px; }

.tally { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }

/* detail */
.d-head { display: grid; gap: 4px; }
.d-head h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }

.views { margin-top: 6px; }
.unit { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.unit h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 16px; font-weight: 600; }
.unit h3 .num { font-size: 20px; color: var(--accent); font-weight: 500; white-space: nowrap; }
.unit h3 .num small { font-size: 13px; }
.dims { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.dims dt { color: var(--ink-faint); }

.dims dd.txt { font-family: var(--sans); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }

.badge { font-size: 11px; font-weight: 600; text-align: center; border-radius: 4px; padding: 1px 0; }
.pass .badge { color: var(--pass); background: var(--pass-bg); }
.warn .badge, .fail .badge { color: var(--warn); background: var(--warn-bg); }
.info .badge { color: var(--info); background: var(--info-bg); }
.basis { font-size: 12px; color: var(--ink-faint); margin: 0; }
.basis a { color: var(--accent); }
.note { font-size: 12.5px; color: var(--ink-soft); background: var(--ice-soft); border-radius: 6px; padding: 8px 10px; margin: 0; }
.tbl-wrap { overflow-x: auto; }
.pipes { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.pipes th, .pipes td { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
.pipes th { font-weight: 500; color: var(--ink-faint); white-space: nowrap; }

.hint {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);

  position: absolute; right: 16px; bottom: 16px; width: 44px; height: 44px;

.north svg { width: 30px; height: 30px; overflow: visible; }

.lbl {
  position: absolute; left: 0; top: 0;

.lbl.minor.ac { color: var(--accent); font-weight: 500; pointer-events: auto; cursor: pointer; border: 1px solid transparent; }
.lbl.minor.ac:hover, .lbl.minor.ac.is-hover { border-color: var(--accent); background: var(--ice-soft); }

.notes { max-width: 1120px; margin: 20px auto 0; }
.notes > details > summary {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px;

.notes > details > summary .m { font-size: 12.5px; color: var(--ink-faint); }
.notes-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; padding: 20px 4px 8px; }
.notes h3 { font-size: 13px; font-weight: 600; margin: 18px 0 8px; }

      g.add(A.cyl(.008, .12, A.M.metal, x + w / doors / 2 - .05, h * .55, d / 2 + .015, 8));
    }
    return g;
  },
  locker(w, d, h, f, A) {
    const g = A.g(), cols = Math.max(1, Math.round(w / .3)), rows = h > 1.4 ? 2 : 1;
    g.add(A.box(w, h, d, A.M.lockerBody, 0, h / 2, 0));
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const x = -w / 2 + w / cols * (i + .5), y = h / rows * (j + .5);
      g.add(A.box(w / cols - .02, h / rows - .02, .008, A.M.lockerDoor, x, y, d / 2 + .005));
      g.add(A.box(.02, .05, .012, A.M.metal, x + w / cols / 2 - .06, y, d / 2 + .012));
      g.add(A.box(w / cols * .4, .012, .01, A.M.metal, x, y + h / rows / 2 - .08, d / 2 + .012));
    }
    return g;
  },
  shelf(w, d, h, f, A) {
    const g = A.g(), tiers = Math.max(2, Math.round(h / .38));
    for (let i = 0; i <= tiers; i++) g.add(A.box(w, .022, d, A.M.wood, 0, i * (h - .022) / tiers + .011, 0));
    for (const sx of [-1, 1]) g.add(A.box(.022, h, d, A.M.wood, sx * (w / 2 - .011), h / 2, 0));
    return g;
  },
  counter(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h - .03, d, .008, A.M.cabFront, 0, (h - .03) / 2, 0));
    g.add(A.rbox(w + .05, .04, d + .05, .008, A.M.stone, 0, h - .02, 0));
    g.add(A.box(w - .06, .012, .012, A.M.metal, 0, .06, d / 2 + .004));
    return g;
  },
  printer(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h * .62, d, .01, A.M.appliance, 0, h * .31, 0));
    g.add(A.rbox(w * .96, h * .3, d * .9, .01, A.M.applianceDark, 0, h * .62 + h * .15, 0));
    g.add(A.box(w * .5, .02, d * .5, A.M.panelWhite, -w * .18, h * .78, d * .05));
    g.add(A.box(w * .3, .06, .02, A.M.screen, w * .22, h * .8, d * .3));
    for (let i = 0; i < 3; i++) g.add(A.box(w - .06, .01, .012, A.M.metal, 0, h * .12 + i * h * .16, d / 2 + .006));
    return g;
  },
  fridge(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h, d, .012, A.M.appliance, 0, h / 2, 0));
    const doors = w > .7 ? 2 : 1;
    for (let i = 0; i < doors; i++) {
      const x = -w / 2 + w / doors * (i + .5);
      g.add(A.box(w / doors - .01, h - .04, .01, A.M.applianceFront, x, h / 2, d / 2 + .006));
      g.add(A.cyl(.012, h * .42, A.M.metal, x + (i ? -1 : 1) * (w / doors / 2 - .06), h * .58, d / 2 + .022, 8));
    }
    return g;
  },
  microwave(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h, d, .008, A.M.applianceDark, 0, h / 2, 0));
    g.add(A.box(w * .62, h - .06, .006, A.M.glassDark, -w * .14, h / 2, d / 2 + .004));
    g.add(A.box(w * .22, h - .08, .008, A.M.panelWhite, w * .34, h / 2, d / 2 + .005));
    return g;
  },
  water_purifier(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h, d, .02, A.M.panelWhite, 0, h / 2, 0));
    g.add(A.box(w * .5, .12, .01, A.M.screen, 0, h * .72, d / 2 + .004));
    g.add(A.cyl(.012, .09, A.M.metal, 0, h * .45, d / 2 - .02));
    g.add(A.box(w * .5, .02, .1, A.M.metal, 0, h * .3, d / 2 - .04));
    return g;
  },
  tv(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h, .04, .004, A.M.applianceDark, 0, h / 2, 0));
    g.add(A.box(w - .05, h - .05, .006, A.M.screen, 0, h / 2, .024));
    return g;
  },
  whiteboard(w, d, h, f, A) {
    const g = A.g();
    g.add(A.box(w, h, .03, A.M.metal, 0, h / 2, 0));
    g.add(A.box(w - .06, h - .06, .008, A.M.panelWhite, 0, h / 2, .02));
    g.add(A.box(w * .5, .02, .06, A.M.metal, 0, .06, .05));
    return g;
  },
  e_board(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h, .06, .006, A.M.applianceDark, 0, h / 2, 0));
    g.add(A.box(w - .07, h - .07, .008, A.M.screen, 0, h / 2, .034));
    return g;
  },
  plant(w, d, h, f, A) {   // 화분 + 잎 덩어리(멀리서는 둥근 수형, 가까이서 잎 몇 장)
    const g = A.g(), pot = Math.min(w, d), ph = Math.min(h * .32, pot * .85);
    g.add(A.cyl(pot / 2, ph, A.M.pot, 0, ph / 2, 0, 16));
    g.add(A.cyl(pot / 2 * .96, ph * .12, A.M.soil, 0, ph - ph * .12, 0, 16));   // 흙 윗면을 화분 테두리보다 낮춘다 — 같은 높이면 면이 갈라진다(z-fighting)
    const r = A.rand(f.center[0] + f.center[1]), top = h - ph;
    for (const [ty, rr] of [[.40, .46], [.64, .52], [.86, .38]]) {   // 잎 덩어리 3 (부드러운 구), 멀리서 수형이 읽힌다
      const m = new A.Mesh(new A.Ico(pot * rr, 1), A.M.leaf);
      m.position.set((r() - .5) * pot * .18, ph + top * ty, (r() - .5) * pot * .18);
      m.scale.set(1, .74, .92); m.rotation.set(r(), r() * 3, r() * .4);
      g.add(m);
    }
    for (let i = 0; i < 8; i++) {   // 가장자리 잎 몇 장: 실루엣이 공으로만 보이지 않게
      const a = r() * Math.PI * 2, t = .3 + r() * .6;
      const leaf = A.plane(pot * .3, pot * .2, A.M.leaf, Math.sin(a) * pot * .44, ph + top * t, Math.cos(a) * pot * .44);
      leaf.rotation.set(-.5 - r() * .6, a, 0);
      g.add(leaf);
    }
    g.add(A.cyl(.016, top * .5, A.M.stem, 0, ph + top * .25, 0, 6));
    return g;
  },
  phone_booth(w, d, h, f, A) {
    const g = A.g();
    g.add(A.box(w, .06, d, A.M.cab, 0, .03, 0));
    g.add(A.box(w, .06, d, A.M.cab, 0, h - .03, 0));
    for (const [x, z, sw, sd] of [[0, -d / 2 + .03, w, .06], [-w / 2 + .03, 0, .06, d], [w / 2 - .03, 0, .06, d]])
      g.add(A.box(sw, h - .12, sd, A.M.frameDark, x, h / 2, z));
    g.add(A.box(w - .12, h - .2, .01, A.M.glass, 0, h / 2, d / 2 - .01));
    g.add(A.rbox(w * .6, .03, d * .45, .004, A.M.wood, 0, .74, -d * .2));
    FURN_BUILD._chair(A, g, 0, 0, d * .12, 180);
    return g;
  },
  door_curtain(w, d, h, f, A) {
    const g = A.g();
    g.add(A.cyl(.012, w, A.M.metal, 0, h, 0, 8, true, 'x'));
    for (let i = 0; i < Math.max(6, Math.round(w / .12)); i++) {
      const x = -w / 2 + w * (i + .5) / Math.max(6, Math.round(w / .12));
      g.add(A.box(w / Math.max(6, Math.round(w / .12)) * .95, h - .12, .012, A.M.curtain, x, (h - .12) / 2, 0));
    }
    return g;
  },
  mirror_wall(w, d, h, f, A) {
    const g = A.g();
    g.add(A.box(w, h, .03, A.M.mirrorFrame, 0, h / 2 + (f.z0 ? 0 : .1), 0));
    g.add(A.box(w - .04, h - .04, .01, A.M.mirror, 0, h / 2 + (f.z0 ? 0 : .1), .022));
    return g;
  },
  stair_rail(w, d, h, f, A) {
    const g = A.g();
    g.add(A.cyl(.022, w, A.M.metal, 0, h, 0, 10, true, 'x'));
    for (let i = 0; i <= Math.round(w / 1.1); i++) g.add(A.cyl(.018, h, A.M.metal, -w / 2 + w * i / Math.max(1, Math.round(w / 1.1)), h / 2, 0, 8));
    g.add(A.box(w, .008, .006, A.M.glass, 0, h * .55, 0));
    return g;
  },

  /* ---------- 카페 ---------- */
  bar_counter(w, d, h, f, A) {

    for (let i = 0; i < Math.max(1, Math.round(w / .9)); i++)
      g.add(A.box(w / Math.max(1, Math.round(w / .9)) - .04, h * .5, .012, A.M.barPanel, -w / 2 + w / Math.max(1, Math.round(w / .9)) * (i + .5), h * .34, d / 2 + .008));
    return g;
  },
  espresso_machine(w, d, h, f, A) {
    const g = A.g();

    g.add(A.box(w - .1, .02, d * .5, A.M.metal, 0, h * .23, d * .1)); // 드립 트레이

  grinder(w, d, h, f, A) {

  ice_maker(w, d, h, f, A) {

  showcase(w, d, h, f, A) {
    const g = A.g();

  under_fridge(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h, d, .01, A.M.chrome, 0, h / 2, 0));

      const x = -w / 2 + w / doors * (i + .5);

      g.add(A.cyl(.01, w / doors * .6, A.M.metal, x, h * .72, d / 2 + .018, 8, true, 'x'));

  },
  upright_fridge(w, d, h, f, A) { return FURN_BUILD.fridge(w, d, h, f, A); },
  sink(w, d, h, f, A) {

    for (let i = 0; i < bowls; i++) g.add(A.box(w / bowls - .12, .04, d - .16, A.M.chromeDark, -w / 2 + w / bowls * (i + .5), h - .04, 0));

  cafe_table(w, d, h, f, A) {

    g.add(A.cyl(.035, h - .05, A.M.frameDark, 0, (h - .05) / 2, 0));
    g.add(A.cyl(Math.min(w, d) * .3, .018, A.M.frameDark, 0, .009, 0, 18));
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2 + (n === 2 ? Math.PI / 2 : Math.PI / 4);
      FURN_BUILD._chair(A, g, Math.sin(a) * (Math.max(w, d) / 2 + .32), 0, Math.cos(a) * (Math.max(w, d) / 2 + .32), a / A.DEG + 180, .82, A.M.cafeChair);

  },
  bar_table(w, d, h, f, A) {

    for (let i = 0; i < Math.max(2, Math.round(w / 1.6)); i++)
      g.add(A.box(.05, h - .04, d * .6, A.M.frameDark, -w / 2 + w * (i + .5) / Math.max(2, Math.round(w / 1.6)), (h - .04) / 2, 0));

      g.add(st);

    return g;

  bench_seat(w, d, h, f, A) {

    for (let i = 0; i < tables; i++) {

    return g;
  },
  pickup_counter(w, d, h, f, A) {

    for (let i = 0; i < 3; i++) g.add(A.cyl(.04, .1, A.M.chrome, -w / 3 + i * w / 3, h + .05, 0, 12));
    return g;
  },

  /* ---------- 의원 ---------- */
  reception_counter(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, h - .04, d * .62, .008, A.M.cabFront, 0, (h - .04) / 2, -d * .19));
    g.add(A.rbox(w + .06, .04, d * .68, .006, A.M.stone, 0, h - .02, -d * .19));
    g.add(A.rbox(w * .42, .74, d * .38, .006, A.M.cabFront, w * .28, .37, d * .31)); // 낮은 상담부
    g.add(A.rbox(w * .46, .035, d * .42, .006, A.M.stone, w * .28, .755, d * .31));
    g.add(A.box(w - .08, .06, .02, A.M.metal, 0, h * .55, d * .12 - d * .19 + .01));

  waiting_bench(w, d, h, f, A) {

    g.add(A.box(w - .1, .05, .05, A.M.frameDark, 0, .36, 0));

  waiting_island(w, d, h, f, A) {

    return g;

  exam_desk(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, .03, d, .005, A.M.deskTop, 0, .735, 0));
    g.add(A.rbox(w * .96, .69, .03, .004, A.M.cab, 0, .35, -d / 2 + .04));
    for (const sx of [-1, 1]) g.add(A.box(.04, .7, d - .08, A.M.cab, sx * (w / 2 - .03), .35, 0));

    FURN_BUILD._monitor(A, g, w * .22, .75, -d * .2, 160, .42);
    FURN_BUILD._chair(A, g, 0, 0, -d / 2 - .38, 0, .98);           // 의사
    FURN_BUILD._chair(A, g, w * .1, 0, d / 2 + .34, 180, .84);     // 환자

  },
  exam_bed(w, d, h, f, A) {
    const g = A.g();
    g.add(A.rbox(w, .12, d, .03, A.M.bedPad, 0, h - .06, 0));
    g.add(A.rbox(w, .1, d * .32, .03, A.M.bedPad, 0, h - .02, -d / 2 + d * .16)); // 등받이
    g.add(A.box(w - .1, .14, d - .1, A.M.panelWhite, 0, h - .2, 0));
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) g.add(A.cyl(.03, h - .26, A.M.metal, sx * (w / 2 - .09), (h - .26) / 2, sz * (d / 2 - .12)));
    return g;

  treat_bed(w, d, h, f, A) {

    g.add(A.rbox(w, .1, d, .025, A.M.bedPad, 0, h - .05, 0));

    g.add(A.cyl(.05, .12, A.M.glass, w / 2 - .06, 1.42, -d / 2 + .1, 12));

  },
  iv_chair(w, d, h, f, A) {
    const g = A.g();

    g.add(A.rbox(w, .62, .12, .03, A.M.chairSeat, 0, .78, -d / 2 + .08));

  study_carrel(w, d, h, f, A) {

  book_shelf(w, d, h, f, A) {

    for (let i = 0; i <= tiers; i++) g.add(A.box(w, .022, d, A.M.wood, 0, i * (h - .022) / tiers + .011, 0));
    const r = A.rand(f.center[0] * 3 + f.center[1]);
    for (let t = 0; t < tiers; t++) {
      let x = -w / 2 + .04;
      while (x < w / 2 - .08) {
        const bw = .02 + r() * .03, bh = .19 + r() * .07;
        g.add(A.box(bw, bh, d * .72, A.M.book(r()), x + bw / 2, t * (h - .022) / tiers + .022 + bh / 2, 0));
        x += bw + .004;

    return g;

  leg_press(w, d, h, f, A) {

  cable_crossover(w, d, h, f, A) {

  power_rack(w, d, h, f, A) {

    g.add(A.cyl(.014, w + .5, A.M.chrome, 0, 1.35, -d / 2 + .12, 10, true, 'x')); // 바벨
    for (const sx of [-1, 1]) for (let i = 0; i < 2; i++) g.add(A.cyl(.22, .05, A.M.gymDark, sx * (w / 2 + .12 + i * .06), 1.35, -d / 2 + .12, 18, true, 'x'));
    g.add(A.rbox(.6, .12, 1.2, .03, A.M.gymPad, 0, .45, d * .1)); // 벤치

  smith_machine(w, d, h, f, A) {
    const g = A.g();

  bench_adj(w, d, h, f, A) {

    const back = A.rbox(w * .55, .12, d * .34, .03, A.M.gymPad, 0, h - .02, -d * .3); back.rotation.x = -.35; g.add(back);
    g.add(A.box(.12, h - .14, d * .8, A.M.gymFrame, 0, (h - .14) / 2, 0));
    for (const sz of [-1, 1]) g.add(A.box(w, .08, .1, A.M.gymFrame, 0, .04, sz * (d / 2 - .08)));

  dumbbell_rack(w, d, h, f, A) {
    const g = A.g();
    for (const sz of [-1, 1]) g.add(A.box(w, .08, .08, A.M.gymRack, 0, h - .06, sz * (d / 2 - .06)));
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) g.add(A.box(.08, h, .08, A.M.gymRack, sx * (w / 2 - .05), h / 2, sz * (d / 2 - .06)));
    g.add(A.box(w - .12, .06, d - .12, A.M.gymRack, 0, h * .45, 0));
    const pairs = Math.max(4, Math.round(w / .26));
    for (let i = 0; i < pairs; i++) for (const lvl of [h - .02, h * .48]) {
      const x = -w / 2 + w * (i + .5) / pairs, r = .07 + (1 - i / pairs) * .04;
      for (const sz of [-1, 1]) {
        g.add(A.cyl(.02, .18, A.M.gymDark, x, lvl + r, sz * d * .2, 8, true, 'x'));
        for (const s2 of [-1, 1]) g.add(A.cyl(r, .06, A.M.gymDark, x + s2 * .1, lvl + r, sz * d * .2, 12, true, 'x'));
      }

    return g;
  },
  barbell_rack(w, d, h, f, A) {

    return g;
  },
  mat_zone(w, d, h, f, A) {

    for (let i = 0; i < 2; i++) g.add(A.rbox(.6, .05, .18, .02, A.M.gymPad, w / 2 - .5, .025, -d / 2 + .4 + i * .25));

  inbody(w, d, h, f, A) {

  /* ---------- 내부 공용 조각 ---------- */
  _chair(A, g, x, z0, z, faceDeg, h = .95, mat) {

  for (const ph of R.penthouse || []) {   // 옥탑: 계단탑·승강기 기계실
    block(ph.rect, R.slab_top_mm, ph.height_mm, CORE_MAT);
    block([ph.rect[0] - 80, ph.rect[1] - 80, ph.rect[2] + 80, ph.rect[3] + 80], R.slab_top_mm + ph.height_mm, 120, CAP_MAT);
  }
  if (R.ps_outlet) {   // 입상관이 옥상으로 나오는 덕트 박스
    block(R.ps_outlet.rect, R.slab_top_mm, R.ps_outlet.height_mm, CORE_MAT);
    block([R.ps_outlet.rect[0] - 60, R.ps_outlet.rect[1] - 60, R.ps_outlet.rect[2] + 60, R.ps_outlet.rect[3] + 60], R.slab_top_mm + R.ps_outlet.height_mm, 80, CAP_MAT);
  }
  for (const st of R.stands || []) {   // 가대(앵글) + 방진패드
    const [sx0, sy0, sx1, sy1] = st.rect, h = st.height_mm, zTop = R.slab_top_mm + h;
    for (const y of [sy0 + 120, sy1 - 120]) {
      block([sx0, y - 40, sx1, y + 40], zTop - 80, 80, STEEL_MAT, false);
      for (let x = sx0 + 200; x <= sx1 - 200; x += 1400) block([x - 40, y - 40, x + 40, y + 40], R.slab_top_mm, h - 80, STEEL_MAT, false);
      for (let x = sx0 + 200; x <= sx1 - 200; x += 1400) block([x - 90, y - 90, x + 90, y + 90], R.slab_top_mm, 20, PAD_MAT, false);   // 방진패드
    }
  }
  const roofLabels = [], rowSeen = new Set();
  for (const u of R.units) {
    const og = buildOutdoor(u);
    const stand = (R.stands || []).find(q => q.id === u.stand);
    og.position.copy(V(u.at[0], u.at[1], R.slab_top_mm + (stand ? stand.height_mm : 150)));
    og.rotation.y = (u.discharge_deg + 90) * DEG;   // 로컬 +z 가 토출 방향
    cur.add(og);
    if (!rowSeen.has(u.row)) { // 줄마다 한 번: 어느 층 실외기 줄인가
      rowSeen.add(u.row);
      const us = R.units.filter(q => q.row === u.row), f = FLOOR[u.floor];
      const xs = us.map(q => q.at[0]), ys = us.map(q => q.at[1]);
      const el = document.createElement('div');
      el.className = 'lbl minor'; el.hidden = true; el.textContent = `${f ? f.level + '층' : u.floor} ${us.length}대 · ${n1(sum(us, q => q.capacity_kw))}kW`;
      $('labels').appendChild(el);
      roofLabels.push({ el, v: V(Math.min(...xs) - 900, (Math.min(...ys) + Math.max(...ys)) / 2, R.slab_top_mm + 900) });
    }
  }
  const tr = R.tray?.polyline;
  if (tr) for (let i = 0; i < tr.length - 1; i++) {   // 사다리형 트레이: 양 옆 레일 + 가로대
    const [[x0, y0], [x1, y1]] = [tr[i], tr[i + 1]], hw = (R.tray.width_mm || 300) / 2, base = R.slab_top_mm + (R.tray.height_mm || 150);
    const horiz = y0 === y1, len = Math.hypot(x1 - x0, y1 - y0);
    for (const sgn of [-1, 1]) {
      const r = horiz ? [Math.min(x0, x1), (y0 + y1) / 2 + sgn * hw - 20, Math.max(x0, x1), (y0 + y1) / 2 + sgn * hw + 20]
        : [(x0 + x1) / 2 + sgn * hw - 20, Math.min(y0, y1), (x0 + x1) / 2 + sgn * hw + 20, Math.max(y0, y1)];
      block(r, base, 80, STEEL_MAT, false);
    }
    for (let d0 = 150; d0 < len; d0 += 300) {
      const x = x0 + (x1 - x0) * d0 / len, y = y0 + (y1 - y0) * d0 / len;
      block(horiz ? [x - 15, y - hw, x + 15, y + hw] : [x - hw, y - 15, x + hw, y + 15], base + 10, 25, STEEL_MAT, false);
    }
    for (let d0 = 0; d0 <= len; d0 += 1500) {   // 트레이 받침
      const x = x0 + (x1 - x0) * d0 / len, y = y0 + (y1 - y0) * d0 / len;
      block([x - 40, y - 40, x + 40, y + 40], R.slab_top_mm, (R.tray.height_mm || 150), STEEL_MAT, false);
    }
  }
  for (const pp of R.piping || []) {   // PS 인출 → 트레이 → 실외기 서비스측
    const path = new THREE.CurvePath();
    let len = 0;
    for (let i = 0; i < pp.polyline.length - 1; i++) {
      const a = V(...pp.polyline[i]), b = V(...pp.polyline[i + 1]);
      if (a.distanceTo(b) < 1e-4) continue;
      path.add(new THREE.LineCurve3(a, b)); len += a.distanceTo(b);
    }
    if (!len) continue;
    cur.add(new THREE.Mesh(new THREE.TubeGeometry(path, Math.max(8, Math.ceil(len / .25)), PIPE.refrigerant_branch[1], 6, false), pipeMat(PIPE.refrigerant_branch[0])));
    const e = pp.polyline[pp.polyline.length - 1];   // 실외기 옆 분기 박스
    block([e[0] - 150, e[1] - 110, e[0] + 150, e[1] + 110], e[2] - 250, 320, STEEL_MAT, false);
  }
  cur = riserG; g.add(riserG);
  const ps = Bd.core.ps, psZ = ps.z_from_by_level?.['1'] ?? 3100;
  block([ps.rect[0] - 20, ps.rect[1] - 20, ps.rect[2] + 20, ps.rect[3] + 20], psZ, R.slab_top_mm + 300 - psZ, RISER_MAT, false);   // 코어 블록과 측면이 같은 평면이었다
  // 입상관: 층마다 실외기 세트 port 에서 배관 샤프트(PS)를 따라 옥상까지(층 안 배관이 여기로 모인다)
  for (const f of Bd.floors) for (const set of DATA[f.key].outdoor_unit.sets) {
    const [x, y, z] = set.port, a = V(x, y, f.z_mm + z), b = V(x, y, R.slab_top_mm + (R.ps_outlet ? R.ps_outlet.height_mm - 200 : 400));
    const tube = new THREE.Mesh(new THREE.CylinderGeometry(.035, .035, a.distanceTo(b), 6), pipeMat(PIPE.refrigerant_main[0]));
    tube.position.copy(a).lerp(b, .5); cur.add(tube);
  }
  cur = roofG;
  pickBox(R.parapet_mm + 1600, R.slab_top_mm, { roof: true, hid: 'roof' });
  const [px0, py0, px1, py1] = R.plant.rect;
  label(`<b>옥상 실외기실</b><span class="kw">실외기 ${R.units.length}대 · ${n1(sum(R.units, u => u.capacity_kw))}kW</span>`,
    V((px0 + px1) / 2, (py0 + py1) / 2, R.slab_top_mm + 2200), 'roof', () => goRoof());
  const boxPts = [0, 1].flatMap(i => [0, 1].flatMap(j => [0, 1].map(k => V(i ? ox1 : ox0, j ? oy1 : oy0, k * topZ))));
  const roof = {
    labels: roofLabels,
    aim: V((px0 + px1) / 2, (py0 + py1) / 2, R.slab_top_mm + 900),
    boxPts: [0, 1].flatMap(i => [0, 1].flatMap(j => [0, 1].map(k => V(i ? px1 + 1500 : px0 - 1500, j ? py1 + 1500 : py0 - 1500, R.slab_top_mm + k * 2500)))),
  };
  [...Object.values(floorG), roofG, riserG].forEach(mergeStatic);
  return { g, floorG, roofG, riserG, pick, labels, roof, boxPts, center: V(cx, cy, 0), aim: V(cx, cy, topZ / 2), half: Math.hypot(W, D) / 2 + mm(topZ) / 2 + 3 };
}

function nice(msg) {
  const P = S.P;
  const zn = Object.fromEntries(P.zones.map(z => [z.id, short(z.name_ko)]));
  const vk = Object.fromEntries(P.views.map(v => [v.id, viewKo(v)]));
  const dict = { ...SEAT_KO, ...VIEW_KO };
  return msg
    .replace(/^([a-z_]+)(?:→([a-z_]+))?:/, (m, a, b) => zn[a] || vk[a] ? `${zn[a] || vk[a]}${b ? ' → ' + (zn[b] || b) : ''}:` : m)
    .replace(/\(([\d.]+평), ([a-z_+]+)\)/, (m, a, b) => `(${a}, ${b.split('+').map(id => zn[id] || id).join('+')})`)
    .replace(/\(AC_\w+\)/g, '').replace(/\bAC_\w+\b/g, id => S.names[id] ? `${S.names[id]} 실내기` : id).replace(/shift_y/g, '렌즈 시프트')
    .replace(/\{([^}]*)\}/g, (_, s) => '(' + s.replace(/'(\w+)'/g, (m2, w) => dict[w] || w) + ')')
    .replace(/\bmini_4way\b/g, '미니 4Way').replace(/\b4way\b/g, '4Way').replace(/\b1way\b/g, '1Way')
    .replace(/'/g, '').replace(/\brule_check\s*/g, '').replace(/must_show/g, '필수 표시').replace(/\bref_(\w+)/g, '배관');
}
