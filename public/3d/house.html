<style>
:root {
  --ground: #F7F9FA;

  --grid: rgb(0 78 100 / .07);
  --paper: #FFFFFF;
  --panel: rgb(255 255 255 / .9);
  --ink: #0B2027;
  --ink-soft: #40545C;
  --ink-faint: #66777F;
  --line: #D6DEE3;
  --mist: #E0E5E9;

  --warn: #7A5200;

  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #07161B;

    --grid: rgb(191 233 242 / .05);

    --panel: rgb(11 31 38 / .9);
    --ink: #E3EDF0;
    --ink-soft: #A9BDC4;
    --ink-faint: #82979F;
    --line: #22404A;
    --mist: #173039;
    --accent: #8ED2E1;
    --accent-deep: #BFE9F2;
    --accent-ink: #00293A;
    --ice-soft: #12343D;
    --pass: #8AD5B4;
    --pass-bg: #12342A;
    --warn: #EBC46F;
    --warn-bg: #362A10;
    --focus: #BFE9F2;
    --shadow: 0 10px 30px rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #07161B;
  --stage: #0B1E24;
  --grid: rgb(191 233 242 / .05);
  --paper: #0E232A;
  --panel: rgb(11 31 38 / .9);
  --ink: #E3EDF0;
  --ink-soft: #A9BDC4;
  --ink-faint: #82979F;
  --line: #22404A;
  --mist: #173039;
  --accent: #8ED2E1;
  --accent-deep: #BFE9F2;
  --accent-ink: #00293A;
  --ice-soft: #12343D;
  --pass: #8AD5B4;
  --pass-bg: #12342A;
  --warn: #EBC46F;
  --warn-bg: #362A10;
  --focus: #BFE9F2;
  --shadow: 0 10px 30px rgb(0 0 0 / .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 16px 24px;
  background: var(--ground);
  color: var(--ink);
  font: 400 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- stage ---------- */
.stage {
  position: relative;
  height: calc(100svh - 40px);
  min-height: 520px;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 28px 28px,
    var(--stage);
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; transition: opacity .25s; }

.topbar {
  position: absolute; inset: 0 0 auto 0;
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px;
  padding: 14px 16px;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: grid; gap: 2px; border: 1px solid transparent; border-radius: 6px; transition: background .3s; }
.stage.in-room .brand { background: var(--panel); border-color: var(--line); padding: 6px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.eyebrow { font-size: 11.5px; letter-spacing: .06em; color: var(--ink-faint); margin: 0; }
.brand h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
.brand h1 .num { font-weight: 500; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn, .seg button {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--ink);
  font-size: 13px; font-weight: 500; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.btn:hover, .seg button:hover { border-color: var(--ink-faint); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { background: var(--accent-deep); }
.btn[aria-pressed]::before {
  content: ""; width: 10px; height: 10px; border-radius: 2px;
  border: 1.5px solid currentColor; opacity: .7;
}
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--ice-soft); }
.btn[aria-pressed="true"]::before { background: currentColor; opacity: 1; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; }
.seg button + button { margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); position: relative; }

/* ---------- sheets ---------- */
.sheet {
  position: absolute;
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
}
.grab {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 44px; padding: 10px 14px;
  background: none; border: 0; border-bottom: 1px solid var(--line);
  text-align: left; cursor: pointer;
}
.grab .t { font-weight: 600; font-size: 13px; }
.grab .chev { width: 9px; height: 9px; border-right: 1.5px solid var(--ink-soft); border-bottom: 1.5px solid var(--ink-soft); transform: rotate(45deg); transition: transform .2s; flex: none; }
.sheet[data-collapsed] .grab .chev { transform: rotate(-135deg); }
.sheet[data-collapsed] .grab { border-bottom-color: transparent; }
.sheet[data-collapsed] .sheet-body { display: none; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 16px; }
.sheet-body > * { flex-shrink: 0; }
.sheet h2.group { font-size: 11.5px; font-weight: 500; letter-spacing: .06em; color: var(--ink-faint); margin-bottom: 6px; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 0; }
.facts div { background: var(--paper); padding: 8px 10px; display: grid; gap: 1px; }
.facts dt { font-size: 11.5px; color: var(--ink-faint); }
.facts dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 500; }
.facts dd small { font-size: 11.5px; color: var(--ink-soft); font-weight: 400; }

.rooms { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.room-btn {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: baseline;
  padding: 8px 10px; border: 1px solid transparent; border-radius: 6px;
  background: none; text-align: left; cursor: pointer;
}
.room-btn:hover, .room-btn.is-hover { background: var(--mist); }
.room-btn[aria-current="true"] { background: var(--ice-soft); border-color: var(--accent); }
.room-btn .n { font-weight: 600; }
.room-btn .a { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); }
.room-btn .u { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.room-btn .u::before { content: ""; width: 14px; height: 6px; border-radius: 2px; background: var(--ice); border: 1px solid var(--accent); flex: none; }
.room-btn.ou .u::before { width: 9px; height: 9px; border-radius: 1px; background: var(--mist); border-color: var(--ink-soft); }

details.others summary { cursor: pointer; font-size: 12.5px; color: var(--ink-soft); padding: 4px 0; }
.others ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
.others li { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-soft); padding: 3px 10px; }
.others li .num { color: var(--ink-faint); }

.legend { display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 22px; border-radius: 3px; flex: none; }

/* detail */
.d-head { display: grid; gap: 4px; }
.d-head h2 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.d-head .eyebrow { color: var(--accent); }
.d-head p.view { margin: 0; color: var(--ink-soft); font-size: 13px; }
.views { margin-top: 6px; }
.unit { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.unit h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 16px; font-weight: 600; }
.unit h3 .num { font-size: 20px; color: var(--accent); font-weight: 500; white-space: nowrap; }
.unit h3 .num small { font-size: 13px; }
.dims { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.dims dt { color: var(--ink-faint); }
.dims dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dims dd.txt { font-family: var(--sans); }
.diagram { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.diagram svg { display: block; width: 100%; height: auto; }
.diagram figcaption { font-size: 11.5px; color: var(--ink-faint); padding: 4px 2px 0; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.checks li { display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: baseline; font-size: 12.5px; line-height: 1.45; }
.badge { font-size: 11px; font-weight: 600; text-align: center; border-radius: 4px; padding: 1px 0; }
.pass .badge { color: var(--pass); background: var(--pass-bg); }
.warn .badge, .fail .badge { color: var(--warn); background: var(--warn-bg); }
.basis { font-size: 12px; color: var(--ink-faint); margin: 0; }
.basis a { color: var(--accent); }
.pipes { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.pipes th, .pipes td { text-align: left; padding: 4px 0; border-bottom: 1px solid var(--line); }
.pipes th { font-weight: 500; color: var(--ink-faint); }
.pipes td.num { text-align: right; }
.sub { font-size: 12.5px; font-weight: 600; margin: 4px 0 -4px; }

.hint {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  margin: 0; padding: 6px 12px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; pointer-events: none;
}
.north {
  position: absolute; right: 16px; bottom: 16px; width: 44px; height: 44px;
  display: grid; place-items: center; pointer-events: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 50%;
}
.north svg { width: 30px; height: 30px; overflow: visible; }

/* 3D labels */
.lbl {
  position: absolute; left: 0; top: 0;
  display: grid; gap: 0; justify-items: center;
  padding: 3px 8px 4px; border-radius: 4px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 12px; line-height: 1.3; white-space: nowrap;
  pointer-events: auto; cursor: pointer; will-change: transform;
}
.lbl b { font-weight: 600; }
.lbl .num { font-size: 11px; color: var(--ink-soft); }
.lbl .kw { font-size: 11px; color: var(--accent); font-family: var(--mono); }
.lbl.is-hover { border-color: var(--accent); background: var(--ice-soft); }
.lbl.minor { background: none; border: 0; padding: 0; color: var(--ink-soft); pointer-events: none; font-size: 11px; text-shadow: 0 0 3px var(--stage), 0 0 2px var(--stage), 0 0 1px var(--stage); }
.lbl.minor b { font-weight: 500; }
.labels.off { opacity: 0; }
.labels.off .lbl { pointer-events: none; }

/* ---------- notes ---------- */
.notes { max-width: 1120px; margin: 20px auto 0; }
.notes > details > summary {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px;
  cursor: pointer; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  list-style: none;
}
.notes > details > summary::-webkit-details-marker { display: none; }
.notes > details > summary .t { font-weight: 600; font-size: 15px; display: flex; gap: 10px; align-items: center; }
.notes > details > summary .t::before { content: ""; width: 8px; height: 8px; border-right: 1.5px solid var(--ink-soft); border-bottom: 1.5px solid var(--ink-soft); transform: rotate(-45deg); transition: transform .2s; }
.notes > details[open] > summary .t::before { transform: rotate(45deg); }
.notes > details > summary .m { font-size: 12.5px; color: var(--ink-faint); }
.notes-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; padding: 20px 4px 8px; }
.notes h3 { font-size: 13px; font-weight: 600; margin: 18px 0 8px; }
.notes h3:first-child { margin-top: 0; }
.notes p, .notes li { font-size: 13px; color: var(--ink-soft); max-width: 65ch; }
.notes p { margin: 0 0 8px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.notes p a, .notes li a, .sheet a { color: var(--accent); text-underline-offset: 2px; }
.src { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.src li { display: grid; grid-template-columns: 40px 1fr; gap: 8px; padding: 4px 6px; border-radius: 4px; }
.src li:target { background: var(--ice-soft); }
.src .sid { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
.src a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; overflow-wrap: anywhere; }
.src .internal { font-size: 11.5px; color: var(--ink-faint); margin-left: 6px; }

@media (min-width: 761px) {
  .sheet.list { top: 84px; left: 16px; width: 300px; max-height: calc(100% - 100px); }
  .sheet.detail { top: 84px; right: 16px; width: 364px; max-height: calc(100% - 100px); }
  .stage.in-room .north { right: 396px; }
}
@media (max-width: 760px) {
  body { padding-block: 12px 20px; }

  .lbl { font-size: 11px; padding: 2px 6px 3px; }
  .lbl .num, .lbl .kw { display: none; }

  .lbl.minor { display: none; }
  .notes-grid { grid-template-columns: 1fr; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { transition: none !important; }
}
/* ---------- embed (?embed): 사이트 히어로 iframe. 캔버스만 남기고 배경은 부모에 맡긴다 ---------- */
html.embed, html.embed body { background: transparent !important; }

{

function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function canvasTex(size, draw, repeatM) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;

}

  for (let i = 0; i < rows; i++) {
    let px = -r() * S * .5;
    while (px < S) {
      const len = S * (.38 + r() * .42);
      x.fillStyle = `hsl(${31 + r() * 5} ${22 + r() * 6}% ${62 + r() * 7}%)`;
      x.fillRect(px, i * rh, len, rh);
      for (let g = 0; g < 16; g++) {
        x.globalAlpha = .05 + r() * .06;
        x.fillStyle = r() < .6 ? '#5b4631' : '#fff8ee';
        x.fillRect(px, i * rh + r() * rh, len, 1 + r() * 2);

      x.globalAlpha = 1;
      x.fillStyle = 'rgba(70,52,36,.35)'; x.fillRect(px, i * rh, 2, rh);

}, 1.6);

for (const w of PLAN.walls) {

}

function roundRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
// plate hanging below local y=0; shape y -> local +z (window side)
function plate(w, h, t, r) {
  const g = new THREE.ExtrudeGeometry(roundRect(w, h, r), { depth: t, bevelEnabled: false, curveSegments: 5 });
  g.rotateX(Math.PI / 2);
  return g;
}
// photo mapping over the whole panel: image top = room side (-z), per the owner's install photos
function planarUV(g, w, h) {
  const p = g.attributes.position, uv = new Float32Array(p.count * 2);
  // seen from below with the room side up, local +x is the viewer's left
  for (let i = 0; i < p.count; i++) { uv[2 * i] = .5 - p.getX(i) / w; uv[2 * i + 1] = .5 - p.getZ(i) / h; }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}
// regions measured on the 1752x617 official photo (px)
const PHOTO = { w: 1752, h: 617, flap: [185, 8, 1560, 130], blades: [170, 318, 1580, 528] };
function patchAndArrow(g, w, h) {
  const pg = new THREE.ShapeGeometry(roundRect(w + .24, h + .24, .05)); pg.rotateX(-Math.PI / 2);
  const patch = new THREE.Mesh(pg, mat.patch); patch.position.y = .004; patch.renderOrder = 3;
  const pts = roundRect(w + .24, h + .24, .05).getPoints(6).map(p => new THREE.Vector3(p.x, .006, p.y));
  const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), mat.patchEdge);
  const a = new THREE.Shape();
  const L0 = h / 2 + .16, L1 = L0 + .42;
  a.moveTo(-.06, L0); a.lineTo(.06, L0); a.lineTo(.06, L1 - .12); a.lineTo(.14, L1 - .12); a.lineTo(0, L1); a.lineTo(-.14, L1 - .12); a.lineTo(-.06, L1 - .12);
  const ag = new THREE.ShapeGeometry(a); ag.rotateX(-Math.PI / 2); // shape +y -> local -z (room side), face up
  const arrow = new THREE.Mesh(ag, mat.arrow); arrow.position.y = .008; arrow.renderOrder = 3;
  for (const o of [patch, edge, arrow]) { o.userData.patch = true; g.add(o); }
}
function build1Way(u) {
  const [L, D, T] = u.size_mm.map(mm);

  const pg = plate(L, D, T, .02); planarUV(pg, L, D);
  g.add(new THREE.Mesh(pg, mat.panel));
  const fr = (px, py) => [(px / PHOTO.w - .5) * L, (py / PHOTO.h - .5) * D];
  // narrow flat perforated flap (room side)
  const [fx0, fz0] = fr(PHOTO.flap[0], PHOTO.flap[1]), [fx1, fz1] = fr(PHOTO.flap[2], PHOTO.flap[3]);
  const fg = plate(fx1 - fx0, fz1 - fz0, .003, .006);
  fg.translate((fx0 + fx1) / 2, -T, (fz0 + fz1) / 2); planarUV(fg, L, D);
  g.add(new THREE.Mesh(fg, mat.panel));

  const [bx0, bz0] = fr(PHOTO.blades[0], PHOTO.blades[1]), [bx1, bz1] = fr(PHOTO.blades[2], PHOTO.blades[3]);
  for (let i = 0; i < 12; i++) {
    const z = lerp(bz0, bz1, i / 11), y = -T - .0012;
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(bx0, y, z), new THREE.Vector3((bx0 + bx1) / 2, y - .005, z), new THREE.Vector3(bx1, y, z));
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 10, .0013, 4, false), mat.blade));
  }
  const [oL, oD] = u.ceiling_opening_mm.map(mm), bh = mm(u.body_h_mm);
  g.add(box(oL, bh, oD, mat.acBody, new THREE.Vector3(0, bh / 2 + .002, 0), false));
  patchAndArrow(g, L, D);
  return g;
}
function build4Way(u) { // square plate + 4 edge blades + centre grille

let tween = null;
// must match the CSS breakpoint (viewport width), not the stage width: at 761-792px they disagreed
const NARROW = matchMedia('(max-width: 760px)');
const narrow = () => NARROW.matches;

// panels that cover the canvas: shift the projection centre into the free area
function occlusion() {
  const w = stage.clientWidth, h = stage.clientHeight, list = $('listSheet'), det = $('detailSheet');
  // embed: 시트를 CSS 로 숨겨도 hidden 속성은 syncUI 가 계속 푼다 -> offsetLeft 0 을 '열림'으로 읽어 방 시점이 반 화면 밀린다
  if (EMBED) return state.mode === 'house' ? { w, h, a: inset.l, b: inset.r, top: inset.t, bot: inset.b } : { w, h, a: 0, b: 0, top: inset.rt, bot: inset.rb };
  const open = el => !el.hidden && !el.hasAttribute('data-collapsed');
  let a = 0, b = 0, top = 0, bot = 0;
  if (state.mode === 'house' || narrow()) top = document.querySelector('.topbar').offsetHeight;
  if (narrow()) {
    const sheet = state.mode === 'house' ? list : det;
    if (open(sheet)) bot = Math.min(sheet.getBoundingClientRect().height, h * .5) + 8;
  } else {
    if (open(list)) a = list.offsetLeft + list.offsetWidth;
    if (open(det)) b = w - det.offsetLeft;
  }
  return { w, h, a, b, top, bot };
}
function applyViewport(o = occlusion()) {
  const { w, h, a, b, top, bot } = o;
  if (EMBED) occNow = o;
  renderer.setSize(w, h, false);
  const W2 = w + Math.abs(a - b), H2 = h + Math.abs(top - bot);
  camera.aspect = W2 / H2;
  if (W2 !== w || H2 !== h) camera.setViewOffset(W2, H2, b > a ? b - a : 0, bot > top ? bot - top : 0, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  invalidate(); // setSize 가 드로잉 버퍼를 비운다
}
// fit the house's bounding box into the free area (call after applyViewport)
const HOUSE_BOX = [0, 1].flatMap(i => [0, 1].flatMap(j => [0, 1].map(k =>
  V(i * E.front_width, j * E.depth_center_right, k * H_WALL))));
function housePose() {
  const { w, h, a, b, top, bot } = occlusion();
  // portrait: look from the south-east corner so the 14.7 m front runs diagonally and the house fills more of the screen
  const fov = 30, dir = (h - top - bot > w - a - b ? new THREE.Vector3(.85, 1.25, .75) : new THREE.Vector3(.2, 1.12, 1)).normalize();
  const tgt = HOUSE_C.clone().setY(.9);
  const cam = camera.clone(); cam.fov = fov; cam.updateProjectionMatrix();
  const fw = w - a - b, fh = h - top - bot;
  const mr = fw < 600 ? .04 : .08; // 폰은 빈 영역 자체가 작아 여백 비율을 반으로
  const availX = EMBED ? Math.max(160, fw - 2 * Math.max(12, fw * mr)) : Math.max(160, w - a - b - 32);
  const availY = EMBED ? Math.max(120, fh - 2 * Math.max(12, fh * mr)) : Math.max(160, h - top - bot - 24);
  let dist = 30, cx = 0, cy = 0;
  for (let it = 0; it < 4; it++) {
    cam.position.copy(tgt).addScaledVector(dir, dist); cam.lookAt(tgt); cam.updateMatrixWorld();
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const c of HOUSE_BOX) {
      const v = c.clone().project(cam);
      x0 = Math.min(x0, v.x * w / 2); x1 = Math.max(x1, v.x * w / 2); y0 = Math.min(y0, v.y * h / 2); y1 = Math.max(y1, v.y * h / 2);
    }
    dist *= Math.max((x1 - x0) / availX, (y1 - y0) / availY);
    const tp = tgt.clone().project(cam);
    cx = (x0 + x1) / 2 - tp.x * w / 2; cy = (y0 + y1) / 2 - tp.y * h / 2;
  }
  if (EMBED) { // 원근 때문에 상자 중심이 과녁에서 비켜 있다 -> 과녁을 상자 중심으로 옮긴다 (픽셀 -> 미터: 과녁 거리의 화면 한 픽셀)
    const H2 = h + Math.abs(top - bot), mpp = 2 * dist * Math.tan(fov * DEG / 2) / H2;
    const q = cam.quaternion, r = new THREE.Vector3(1, 0, 0).applyQuaternion(q), u = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
    tgt.addScaledVector(r, cx * mpp).addScaledVector(u, cy * mpp);
  }
  return { pos: tgt.clone().addScaledVector(dir, dist), tgt, fov };
}
function roomPose(id, i) {

    const c = V(OU.position[0], OU.position[1], 500);
    return { pos: c.clone().add(new THREE.Vector3(-1.3, 3.1, 3.6)), tgt: c, fov: 40, kind: 'ou' };
