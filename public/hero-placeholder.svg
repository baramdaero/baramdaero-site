<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" preserveAspectRatio="xMidYMid slice">
  <!-- placeholder: 실내에서 창밖(폭우)이 보이는 구도 — 실제 촬영 이미지로 교체 예정. 플랫 단색만 사용 -->
  <rect width="2400" height="1350" fill="#4A443D"/>
  <rect y="1010" width="2400" height="340" fill="#35302A"/>
  <!-- 창 개구부 (중앙 상단 40% 부근 — 줌 타깃) -->
  <rect x="880" y="300" width="640" height="480" fill="#5F6B77"/>
  <!-- 폭우 표현: 플랫 사선 스트로크 -->
  <g stroke="#8593A0" stroke-width="6" opacity="0.55">
    <line x1="960" y1="330" x2="930" y2="440"/>
    <line x1="1060" y1="360" x2="1030" y2="470"/>
    <line x1="1160" y1="320" x2="1130" y2="430"/>
    <line x1="1260" y1="380" x2="1230" y2="490"/>
    <line x1="1360" y1="330" x2="1330" y2="440"/>
    <line x1="1460" y1="370" x2="1430" y2="480"/>
    <line x1="1010" y1="540" x2="980" y2="650"/>
    <line x1="1110" y1="580" x2="1080" y2="690"/>
    <line x1="1210" y1="540" x2="1180" y2="650"/>
    <line x1="1310" y1="590" x2="1280" y2="700"/>
    <line x1="1410" y1="550" x2="1380" y2="660"/>
  </g>
  <!-- 창 프레임 -->
  <g fill="#2A2D31">
    <rect x="856" y="276" width="688" height="24"/>
    <rect x="856" y="780" width="688" height="24"/>
    <rect x="856" y="276" width="24" height="528"/>
    <rect x="1520" y="276" width="24" height="528"/>
    <rect x="1188" y="300" width="24" height="480"/>
  </g>
  <!-- 실내 소품 암시: 플랫 실루엣 -->
  <rect x="240" y="820" width="360" height="190" fill="#3E3831"/>
  <rect x="1840" y="760" width="80" height="250" fill="#3E3831"/>
</svg>
