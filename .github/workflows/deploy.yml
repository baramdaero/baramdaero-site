# 바람대로 사이트 — GitHub Pages 배포
# ⚠️ 이 파일 변경은 수동 승인 대상 (CLAUDE.md 절대 규칙 1).
#    main 반영·Pages 활성화(Settings → Pages → Source: GitHub Actions)·DNS 연결은 박민혁 승인 후.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 배포가 끝나면 이번에 바뀐 공개 페이지만 검색엔진에 알린다 (api.indexnow.org → Bing·Naver 등 공유). 실패해도 배포는 유지.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 이번 push 에서 바뀐 파일을 보려고
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 바뀐 페이지만 알린다(IndexNow: 바뀌지 않은 주소 재전송 금지). 수동 실행(workflow_dispatch)이면 before 가 없어 보내지 않는다
      # core.quotePath=false — 안 하면 한글 파일 이름이 "\354\204…" 로 나와 사례 주소를 못 찾는다(10-01 실측)
      - run: CHANGED="$(git -c core.quotePath=false diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null)" node scripts/indexnow.mjs
        env:
          BEFORE: ${{ github.event.before }}
